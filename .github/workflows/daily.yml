name: Daily ETF signals

on:
  schedule:
    # 13:17 UTC = 18:47 IST, Monday-Friday (after NSE close and bhavcopy publication)
    - cron: "17 13 * * 1-5"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

permissions:
  contents: write         # needed to commit updated data/signals back to the repo

concurrency:
  group: daily-signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests   # broken code must not send signals
        run: python -m pytest -q

      - name: Run pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pipeline.py

      - name: Commit data and signals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ signals/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily update $(date -u +%Y-%m-%d)"
            git push
          fi

      # Dashboard: after signals are sent and saved, so a Cloudflare problem can't block them.
      - name: Build dashboard
        id: dashboard
        continue-on-error: true
        run: python dashboard.py

      - name: Create Pages project (no-op if it already exists)
        if: steps.dashboard.outcome == 'success'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create etf-signals-naman --production-branch=main

      - name: Deploy dashboard to Cloudflare Pages
        if: steps.dashboard.outcome == 'success'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy output/dashboard --project-name=etf-signals-naman --branch=main --commit-dirty=true
